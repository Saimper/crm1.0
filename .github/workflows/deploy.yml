name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # En main NO se cancela: abortar el job a mitad del script de deploy dejaba
  # el CRM en mantenimiento (503). En ramas sí, para no gastar runners.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Nodo raíz: instala dependencias y compila assets una sola vez ──
  setup:
    name: Preparar deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, bcmath, pdo, pdo_mysql, zip, gd, intl, fileinfo, curl, openssl, tokenizer
          coverage: none
          tools: composer:v2

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1

  # ── Rama 1: estilo de código ──
  pint:
    name: Estilo (Pint)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, bcmath, pdo, pdo_mysql, zip, gd, intl, fileinfo, curl, openssl, tokenizer
          coverage: none
          tools: composer:v2
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Pint
        run: ./vendor/bin/pint --test

  # ── Rama 2: análisis estático ──
  larastan:
    name: Análisis (Larastan)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, bcmath, pdo, pdo_mysql, zip, gd, intl, fileinfo, curl, openssl, tokenizer
          coverage: none
          tools: composer:v2
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Larastan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # ── Rama 3: suite de tests ──
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: crm_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: crm_test
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, bcmath, pdo, pdo_mysql, zip, gd, intl, fileinfo, curl, openssl, tokenizer
          coverage: none
          tools: composer:v2
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL up"; break
            fi
            echo "waiting for mysql..."; sleep 2
          done
      - name: Run tests
        run: php artisan test

  # ── Rama 4: trinquete de fugas multi-mandante ──
  #
  # El grupo `fuga-pendiente` son tests escritos para fallar: cada uno documenta
  # un agujero de aislamiento entre clientes que sigue abierto. `phpunit.xml` los
  # excluye del run normal, así que hasta ahora el CI daba verde con las fugas
  # dentro y nadie las veía.
  #
  # Este job no exige cerrarlas hoy —son 23 y bloquearían todo trabajo—: exige
  # que no aumenten. El número vive en tests/fugas-pendientes.baseline y sólo se
  # sube a mano, con explicación en el PR.
  fugas:
    name: Fugas de tenant (trinquete)
    runs-on: ubuntu-latest
    needs: setup
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: crm_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: crm_test
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, bcmath, pdo, pdo_mysql, zip, gd, intl, fileinfo, curl, openssl, tokenizer
          coverage: none
          tools: composer:v2
      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL up"; break
            fi
            echo "waiting for mysql..."; sleep 2
          done
      - name: Verificar que no crecen las fugas
        run: bin/verificar-fugas.sh

  # ── Nodo de convergencia ──
  ci-ok:
    name: CI aprobado
    runs-on: ubuntu-latest
    needs: [pint, larastan, tests, fugas]
    steps:
      - run: echo "CI aprobado ✅ — Pint, Larastan, Tests y trinquete de fugas en verde"

  # ── Despliegue (solo main, tras CI aprobado) ──
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            export PATH="/opt/php82/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            export COMPOSER_ALLOW_SUPERUSER=1
            PHP=/opt/php82/bin/php
            cd /var/www/crm

            # Red de seguridad, con una excepcion: si cualquier paso falla, el
            # sitio se levanta igual. Sin esto, un fallo posterior a `artisan
            # down` (composer, npm) dejaba el CRM en 503 indefinidamente,
            # tambien para el wrapper que lo embebe, hasta que alguien entrara
            # por SSH.
            #
            # La excepcion es la base. Levantar el sitio despues de que una
            # migracion muera a mitad lo devuelve a produccion con codigo NUEVO
            # sobre esquema VIEJO, que es peor que el 503: MySQL no envuelve el
            # DDL en transaccion, asi que un ALTER que revento a mitad deja la
            # tabla en un estado que ninguna version del codigo sabe leer, y los
            # fallos no se ven —la bandeja da 500, el listener de autoasignacion
            # se traga el error, y el healthcheck solo mira /login—. En ese caso
            # el mantenimiento se queda puesto y el trap imprime que hacer.
            FASE=arranque
            al_salir() {
              rc=$?
              if [ "$rc" -eq 0 ]; then
                exit 0
              fi
              case "$FASE" in
                migracion|seeders)
                  echo ""
                  echo "=================================================================="
                  echo " DEPLOY DETENIDO EN LA FASE: $FASE (codigo $rc)"
                  echo " EL SITIO SE QUEDA EN MANTENIMIENTO A PROPOSITO."
                  echo ""
                  echo " El esquema puede haber quedado a medias. Levantarlo ahora"
                  echo " serviria codigo nuevo sobre una base que no le corresponde."
                  echo ""
                  echo " Commit anterior al deploy: $ANTERIOR"
                  echo " Commit desplegado:         $(git rev-parse HEAD)"
                  echo " Respaldo de la base:       ${RESPALDO:-no habia migraciones pendientes, no se hizo}"
                  echo ""
                  echo " Desde /var/www/crm, con la base ya revisada a mano:"
                  echo "   1. /opt/php82/bin/php artisan migrate:status     # que quedo aplicado"
                  echo "   2. arreglar o completar la migracion"
                  echo "   3. npm ci && npm run build         # los assets no llegaron a construirse"
                  echo "   4. /opt/php82/bin/php artisan optimize:clear && /opt/php82/bin/php artisan optimize"
                  echo "   5. /opt/php82/bin/php artisan up"
                  echo ""
                  echo " Para volver al commit anterior (ojo: el esquema NO vuelve solo)."
                  echo "   git reset --hard $ANTERIOR && composer install --no-dev"
                  echo "=================================================================="
                  ;;
                *)
                  $PHP artisan up || true
                  ;;
              esac
              exit $rc
            }
            trap al_salir EXIT

            $PHP artisan down --render="errors::503" || true

            ANTERIOR=$(git rev-parse HEAD)
            ANTERIOR_CORTO=$(git rev-parse --short HEAD)
            git fetch origin main

            # El respaldo va ANTES del `git reset`, y no justo antes de migrar,
            # por una razon concreta: aqui el arbol todavia tiene el codigo
            # VIEJO, asi que si el volcado falla el trap levanta el sitio y lo
            # que vuelve a produccion es codigo y esquema que se corresponden.
            # Un fichero .env se lee con sed y no con `source`: sus valores no
            # son shell y una comilla interna en la contrasena romperia el
            # deploy. Solo se quitan las comillas que envuelven.
            FASE=respaldo
            env_crm() {
              sed -n "s/^$1=//p" .env | head -1 \
                | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"
            }

            RESPALDO=""
            if [ -n "$(git diff --name-only HEAD origin/main -- database/migrations/)" ]; then
              command -v mysqldump >/dev/null 2>&1 || {
                echo "Este push trae migraciones y en el VPS no hay mysqldump."
                echo "Sin copia no se migra: instalalo o despliega sin migraciones."
                exit 1
              }

              mkdir -p /var/backups/crm
              RESPALDO="/var/backups/crm/crm-$(date +%Y%m%d-%H%M%S)-$ANTERIOR_CORTO.sql.gz"

              # Sin `--routines --triggers --events`: el esquema no tiene
              # ninguno de los tres —comprobado contra `information_schema`— y
              # cada bandera exige un privilegio que el usuario de la aplicacion
              # puede no tener. Pedirlos de mas convierte un deploy sano en un
              # «Access denied» y ahi la compuerta estorba en vez de proteger.
              CRUDO="${RESPALDO%.gz}"
              MYSQL_PWD="$(env_crm DB_PASSWORD)" mysqldump \
                --host="$(env_crm DB_HOST)" --port="$(env_crm DB_PORT)" \
                --user="$(env_crm DB_USERNAME)" \
                --single-transaction \
                "$(env_crm DB_DATABASE)" > "$CRUDO"

              # mysqldump firma el final del volcado. Si no esta esa linea, el
              # volcado se corto a mitad y lo que hay es una copia que parece
              # copia. Se comprueba aqui y no despues porque a partir del
              # siguiente paso ya no hay vuelta.
              tail -c 200 "$CRUDO" | grep -q "Dump completed" || {
                echo "El volcado se corto a mitad: $CRUDO"
                rm -f "$CRUDO"
                exit 1
              }

              gzip -f "$CRUDO"
              echo "Respaldo: $RESPALDO ($(du -h "$RESPALDO" | cut -f1))"

              # Siete copias. Cada una es la foto de antes de una migracion, que
              # es justo lo que hace falta y nada mas; guardarlas todas llena el
              # disco del VPS y ahi se cae tambien lo que si esta sirviendo.
              ls -1t /var/backups/crm/crm-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
            fi

            FASE=codigo
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            FASE=migracion
            $PHP artisan migrate --force

            # Roles y permisos viven en seeders idempotentes (upsert por codigo),
            # no en migraciones, y en produccion no los corria nadie: los permisos
            # de F36/F38 (proyectos.configurar, mandante.administrar,
            # proyectos.crear) nunca llegaron. Los roles base son inmutables desde
            # la UI (CLAUDE.md s.10) y estos tres seeders solo ANADEN o actualizan
            # filas por codigo, asi que correrlos en cada deploy es seguro.
            # NUNCA UsuariosSeeder ni DatabaseSeeder: UsuarioAdminGlobalSeeder
            # resetea la contrasena del admin. Barras simples a proposito: el
            # bloque literal de YAML y las comillas simples del shell las pasan
            # tal cual, y PHP no resuelve una clase escrita con barras dobles.
            FASE=seeders
            $PHP artisan db:seed --force --class='Database\Seeders\Usuarios\RolesSeeder'
            $PHP artisan db:seed --force --class='Database\Seeders\Usuarios\PermisosSeeder'
            $PHP artisan db:seed --force --class='Database\Seeders\Usuarios\RolPermisoSeeder'

            FASE=assets
            npm ci
            npm run build

            $PHP artisan optimize:clear
            $PHP artisan optimize

            chown -R www-data:www-data storage bootstrap/cache

            $PHP artisan queue:restart
            systemctl reload php82-fpm

            $PHP artisan up
            trap - EXIT

            # El deploy no se da por bueno hasta que el sitio responde de verdad.
            ok=0
            for intento in 1 2 3 4 5; do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' https://crm.viciconnect.net/login || true)
              if [ "$codigo" = "200" ] || [ "$codigo" = "302" ]; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "Healthcheck FALLO tras 5 intentos (ultimo codigo HTTP: $codigo)" >&2
              exit 1
            fi
            echo "Healthcheck OK (HTTP $codigo)"
